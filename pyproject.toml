[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-parser"
version = "0.1.0"
description = "Convert Russian bank export files into a canonical transaction CSV."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
bank-parser = "bank_parser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
