[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-parser"
version = "0.1.0"
description = "Convert Russian bank export files into a canonical transaction CSV."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.1,<4",
    "pdfplumber>=0.11.10,<0.12",
    "pypdf>=7,<8",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

[project.scripts]
bank-parser = "bank_parser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
